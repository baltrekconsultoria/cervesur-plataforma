name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'ci/**'
      - 'security/**'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security-tests:
    name: PHP syntax, security tests, and isolated HTTP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for static tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build isolated PHP 8.3 test image
        run: docker build --tag cervesur-ci-php:local --file tests/isolated/Dockerfile .

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            cervesur-ci-php:local sh -lc '
              find backend tests -type f -name "*.php" -print0 | xargs -0 -r -n 1 php -l >/dev/null
              count=$(find backend tests -type f -name "*.php" | wc -l)
              echo "PHP syntax: ${count} files passed"
            '

      - name: Run PHP security unit tests
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            cervesur-ci-php:local php tests/security_unit.php
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            cervesur-ci-php:local php tests/mode_unit.php
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            cervesur-ci-php:local php tests/admin_write_unit.php

      - name: Run static security tests
        run: python -m unittest discover -s tests -v

      - name: Run production packaging tests (UX-08H.1)
        run: node deploy/produccion-escritura/probar-empaquetado.mjs

      - name: Run HTTP tests with synthetic MySQL
        shell: bash
        run: |
          set -euo pipefail

          network_name="cervesur-ci-net-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          db_name="cervesur-ci-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          app_name="cervesur-ci-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          appprod_name="cervesur-ci-appprod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          appadmin_name="cervesur-ci-appadmin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          appw_name="cervesur-ci-appw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          appu_name="cervesur-ci-appu-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          appuoff_name="cervesur-ci-appuoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          appmin_name="cervesur-ci-appmin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ro_prefix="cervesur-ci-ro-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm --force "$app_name" "$appprod_name" "${ro_prefix}-appro" "${ro_prefix}-appdiag" "${ro_prefix}-appbad1" "${ro_prefix}-appbad2" "${ro_prefix}-appbad3" "${ro_prefix}-appvis" "${ro_prefix}-appvis0" "${ro_prefix}-appvisall" "${ro_prefix}-appvthr" "${ro_prefix}-appvbad1" "${ro_prefix}-appvbad2" "${ro_prefix}-appusr" "${ro_prefix}-appusr0" "${ro_prefix}-appusrthr" "${ro_prefix}-appusrhttps" "${ro_prefix}-appusrbad1" "${ro_prefix}-appusrbad2" "${ro_prefix}-appadm" "${ro_prefix}-appadm0" "${ro_prefix}-appadmthr" "${ro_prefix}-appadmhttps" "${ro_prefix}-appadmbad" "$appadmin_name" "$appw_name" "$appu_name" "$appuoff_name" "$appmin_name" "$db_name" >/dev/null 2>&1 || true
            docker network rm "$network_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          export TEST_DB_PASS
          export DB_PASS
          export MYSQL_ROOT_PASSWORD
          export JWT_SECRET
          TEST_DB_PASS="$(openssl rand -hex 24)"
          DB_PASS="$TEST_DB_PASS"
          MYSQL_ROOT_PASSWORD="$TEST_DB_PASS"
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$TEST_DB_PASS"
          echo "::add-mask::$JWT_SECRET"

          docker network create --internal "$network_name"
          docker run --detach --name "$db_name" --network "$network_name" --network-alias db \
            --env MYSQL_ROOT_PASSWORD --env MYSQL_DATABASE=fixture \
            mysql:8.0 >/dev/null

          for attempt in $(seq 1 30); do
            if docker exec "$db_name" mysqladmin ping -h 127.0.0.1 -uroot \
              --password="$TEST_DB_PASS" --silent >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Synthetic MySQL did not become ready.' >&2
              exit 1
            fi
            sleep 1
          done

          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS \
            cervesur-ci-php:local php tests/isolated/seed.php

          docker run --detach --name "$app_name" --network "$network_name" --network-alias app \
            --read-only --tmpfs /tmp \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env DB_HOST=db --env DB_NAME=fixture --env DB_USER=root --env DB_PASS \
            --env DB_CHARSET=utf8mb4 --env JWT_SECRET --env JWT_EXPIRATION=3600 --env PHP_CLI_SERVER_WORKERS=4 \
            cervesur-ci-php:local php -S 0.0.0.0:8080 tests/isolated/router.php >/dev/null

          sleep 1
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            cervesur-ci-php:local php tests/isolated/http_test.php

          # UX-06B.0: fixture de volumen (0, 1, 20, 21, 45 y 105 relaciones) y pruebas de paginación, vistas y compatibilidad.
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS \
            cervesur-ci-php:local php tests/isolated/seed_pagination.php
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            cervesur-ci-php:local php tests/isolated/http_pagination_test.php

          # SEC-05A: registro solo administrativo, política de roles y ausencia de detalle de BD en respuestas
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS \
            cervesur-ci-php:local php tests/isolated/http_auth_hardening_test.php

          # UX-07A: administración de accesos (ids de relación, vistas mínimas, validaciones, retirada y reactivación)
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS \
            cervesur-ci-php:local php tests/isolated/http_admin_access_test.php

          # UX-07B: empresas, informes y asociaciones empresa-informe
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS \
            cervesur-ci-php:local php tests/isolated/http_company_report_test.php

          # UX-07C: registro por enlace, identificadores internos/externos y configuración autorizada del visor (incluye la migración reversible)
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS \
            cervesur-ci-php:local php tests/isolated/http_viewer_test.php

          # UX-08A: filtro de estado active|inactive|all en los listados administrativos.
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS \
            cervesur-ci-php:local php tests/isolated/http_status_filter_test.php

          # UX-08C: lista de informes que el administrador puede abrir en el visor (segunda instancia con ADMIN_VIEWER_ALLOWED_REPORT_IDS).
          docker run --detach --name "$appadmin_name" --network "$network_name" --network-alias appadmin             --read-only --tmpfs /tmp             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env DB_HOST=db --env DB_NAME=fixture --env DB_USER=root --env DB_PASS             --env DB_CHARSET=utf8mb4 --env JWT_SECRET --env JWT_EXPIRATION=3600 --env PHP_CLI_SERVER_WORKERS=4             --env ADMIN_VIEWER_ALLOWED_REPORT_IDS=1,903             cervesur-ci-php:local php -S 0.0.0.0:8080 tests/isolated/router.php >/dev/null
          sleep 1
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS             cervesur-ci-php:local php tests/isolated/http_admin_viewer_allowlist_test.php

          # UX-08B.2: bitácora de solo inserción (triggers) aplicada y revertida sobre una base propia.
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS             cervesur-ci-php:local php tests/isolated/audit_immutability_test.php

          # UX-08B: capa transaccional de escrituras, auditoría, conflictos 409, concurrencia y vistas estrictas.
          # Base aparte (`fixture_w`) con los UNIQUE productivos; la instancia exige auditoría (AUDIT_LOG_MODE=required).
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS             cervesur-ci-php:local php tests/isolated/seed_writes.php
          docker run --detach --name "$appw_name" --network "$network_name" --network-alias appw             --read-only --tmpfs /tmp             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env DB_HOST=db --env DB_NAME=fixture_w --env DB_USER=root --env DB_PASS             --env DB_CHARSET=utf8mb4 --env JWT_SECRET --env JWT_EXPIRATION=3600 --env PHP_CLI_SERVER_WORKERS=4             --env AUDIT_LOG_MODE=required --env REACT_STRICT_VIEWS=1             cervesur-ci-php:local php -S 0.0.0.0:8080 tests/isolated/router.php >/dev/null
          sleep 1
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS             cervesur-ci-php:local php tests/isolated/http_writes_test.php

          # UX-08B.2: escrituras transaccionales y auditadas de las tres relaciones, historial y concurrencia.
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS             cervesur-ci-php:local php tests/isolated/http_access_writes_test.php

          # UX-08B.3: migración mínima grupo_id NULL (up/down con rechazo de la reversión incompatible). Debe ir después de las suites de escritura.
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS             cervesur-ci-php:local php tests/isolated/http_report_nogroup_test.php

          # UX-08E: la API completa conectada como la cuenta de privilegios mínimos (plantilla database/privileges). Va al final: usa y limpia `fixture_w`.
          MIN_PASS="$(openssl rand -hex 12)"
          echo "::add-mask::$MIN_PASS"
          docker run --detach --name "$appmin_name" --network "$network_name" --network-alias appmin             --read-only --tmpfs /tmp             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env DB_HOST=db --env DB_NAME=fixture_w --env DB_USER=app_admin_min --env DB_PASS="$MIN_PASS"             --env DB_CHARSET=utf8mb4 --env JWT_SECRET --env JWT_EXPIRATION=3600 --env PHP_CLI_SERVER_WORKERS=4             --env AUDIT_LOG_MODE=required --env REACT_STRICT_VIEWS=1 --env USER_ADMIN_WRITES=1 --env NEW_USER_ROLE=usuario             cervesur-ci-php:local php -S 0.0.0.0:8080 tests/isolated/router.php >/dev/null
          sleep 1
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS --env MIN_PASS="$MIN_PASS"             cervesur-ci-php:local php tests/isolated/http_min_privileges_test.php

          # UX-08E: la cuenta de privilegios mínimos puede lo necesario y nada más (MySQL desechable; la plantilla nunca toca un servidor real).
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS             cervesur-ci-php:local php tests/isolated/privileges_matrix_test.php

          # UX-08B.3: administración de usuarios. `appu` con USER_ADMIN_WRITES=1; `appuoff` sin el interruptor (las rutas deben responder 404).
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS             cervesur-ci-php:local php tests/isolated/seed_users.php
          for spec in "appu:$appu_name:1" "appuoff:$appuoff_name:0"; do
            alias="${spec%%:*}"; rest="${spec#*:}"; name="${rest%%:*}"; flag="${rest##*:}"
            extra=(); [ "$flag" = "1" ] && extra=(--env USER_ADMIN_WRITES=1 --env REACT_STRICT_VIEWS=1)
            docker run --detach --name "$name" --network "$network_name" --network-alias "$alias"               --read-only --tmpfs /tmp               --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work               --env DB_HOST=db --env DB_NAME=fixture_u --env DB_USER=root --env DB_PASS               --env DB_CHARSET=utf8mb4 --env JWT_SECRET --env JWT_EXPIRATION=3600 --env PHP_CLI_SERVER_WORKERS=4               --env AUDIT_LOG_MODE=required "${extra[@]}"               cervesur-ci-php:local php -S 0.0.0.0:8080 tests/isolated/router.php >/dev/null
          done
          sleep 1
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS --env JWT_SECRET             cervesur-ci-php:local php tests/isolated/http_users_admin_test.php

          # UX-08B.2: matriz de sesiones y tokens (necesita el secreto de la instancia para forjar tokens inválidos).
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS --env JWT_SECRET             cervesur-ci-php:local php tests/isolated/http_session_matrix_test.php

          # UX-07D.2B: esquema e identificadores PRODUCTIVOS sintéticos (reporte_id de hasta 50 caracteres no UUID, grupo_id NOT NULL,
          # enlace VARCHAR(500)) en una base aparte (`fixture_prod`) servida por una segunda instancia del backend.
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS             cervesur-ci-php:local php tests/isolated/seed_productive.php
          docker run --detach --name "$appprod_name" --network "$network_name" --network-alias appprod             --read-only --tmpfs /tmp             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env DB_HOST=db --env DB_NAME=fixture_prod --env DB_USER=root --env DB_PASS             --env DB_CHARSET=utf8mb4 --env JWT_SECRET --env JWT_EXPIRATION=3600 --env PHP_CLI_SERVER_WORKERS=4             cervesur-ci-php:local php -S 0.0.0.0:8080 tests/isolated/router.php >/dev/null
          sleep 1
          docker run --rm --network "$network_name"             --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work             --env TEST_DB_PASS             cervesur-ci-php:local php tests/isolated/http_productive_ids_test.php

          # UX-07D.3A: modo de solo lectura y de diagnóstico con CUENTAS MySQL de solo lectura (permisos SELECT por columna, creadas con el procedimiento
          # administrativo real) y tres configuraciones inválidas que deben rechazarse (503) sin abrir la base de datos.
          RO_DIAG_PASS="Aa1!$(openssl rand -hex 12)"; RO_PILOT_PASS="Aa1!$(openssl rand -hex 12)"
          RO_DIAG_TOKEN="$(openssl rand -hex 20)"; RO_JWT="$(openssl rand -hex 20)"
          export RO_DIAG_PASS RO_PILOT_PASS RO_DIAG_TOKEN
          echo "::add-mask::$RO_DIAG_PASS"; echo "::add-mask::$RO_PILOT_PASS"; echo "::add-mask::$RO_DIAG_TOKEN"; echo "::add-mask::$RO_JWT"
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS --env RO_DIAG_PASS --env RO_PILOT_PASS \
            cervesur-ci-php:local php tests/isolated/setup_readonly_accounts.php
          start_ro() {
            local name="$1"; shift
            docker run --detach --name "${ro_prefix}-${name}" --network "$network_name" --network-alias "$name" \
              --read-only --tmpfs /tmp --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
              --env DB_HOST=db --env DB_NAME=fixture_prod --env DB_CHARSET=utf8mb4 --env JWT_EXPIRATION=900 --env PHP_CLI_SERVER_WORKERS=4 "$@" \
              cervesur-ci-php:local php -S 0.0.0.0:8080 tests/isolated/router.php >/dev/null
          }
          start_ro appro --env CERVESUR_MODE=read_only --env DB_USER=cervesur_ro_pilot --env DB_PASS="$RO_PILOT_PASS" --env JWT_SECRET="$RO_JWT"
          start_ro appdiag --env CERVESUR_REQUIRED_MODE=diagnostico --env CERVESUR_MODE=diagnostico --env DB_USER=cervesur_ro_diag --env DB_PASS="$RO_DIAG_PASS" --env CERVESUR_DIAG_TOKEN="$RO_DIAG_TOKEN"
          start_ro appbad1 --env CERVESUR_MODE=solo_lectura --env DB_USER=cervesur_ro_pilot --env DB_PASS="$RO_PILOT_PASS" --env JWT_SECRET="$RO_JWT"
          docker run --detach --name "${ro_prefix}-appbad2" --network "$network_name" --network-alias appbad2 \
            --read-only --tmpfs /tmp --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env DB_HOST=db --env DB_NAME=cervesur_portalbi --env DB_USER=root --env DB_PASS --env JWT_SECRET="$RO_JWT" \
            cervesur-ci-php:local php -S 0.0.0.0:8080 tests/isolated/router.php >/dev/null
          start_ro appbad3 --env CERVESUR_MODE=read_only --env DB_USER=root --env DB_PASS --env JWT_SECRET="$RO_JWT"
          sleep 2
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS \
            cervesur-ci-php:local php tests/isolated/http_permissions_matrix_test.php
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS --env RO_DIAG_PASS --env RO_PILOT_PASS --env RO_DIAG_TOKEN \
            cervesur-ci-php:local php tests/isolated/http_readonly_test.php
          for suite in privilegios_minimos_test.php conexion_solo_lectura_test.php; do
            docker run --rm --network "$network_name" \
              --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
              --env TEST_DB_PASS --env RO_DIAG_PASS --env RO_DIAG_TOKEN \
              cervesur-ci-php:local php "tests/isolated/$suite"
          done

          # UX-07D.4 express: piloto visual (consulta real de empresas e informes para UN operador autorizado) con la cuenta cervesur_ro_visor de 15 columnas.
          RO_VISOR_PASS="Aa1!$(openssl rand -hex 12)"; PILOT_PASS="$(openssl rand -hex 14)"; export RO_VISOR_PASS PILOT_PASS
          echo "::add-mask::$RO_VISOR_PASS"; echo "::add-mask::$PILOT_PASS"
          PILOT_HASH="$(docker run --rm --env PILOT_PASS cervesur-ci-php:local php -r 'echo password_hash(getenv("PILOT_PASS"), PASSWORD_BCRYPT);')"
          echo "::add-mask::$PILOT_HASH"
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS --env RO_VISOR_PASS \
            cervesur-ci-php:local php tests/isolated/setup_visor_account.php
          PILOT_IDS="$(docker exec "$db_name" mysql -N -uroot --password="$TEST_DB_PASS" fixture_prod -e 'SELECT GROUP_CONCAT(id) FROM (SELECT id FROM reporte WHERE activo = 1 ORDER BY id LIMIT 2) x' 2>/dev/null)"
          export PILOT_IDS
          PJ1="$(openssl rand -hex 24)"; PJ2="$(openssl rand -hex 24)"
          echo "::add-mask::$PJ1"; echo "::add-mask::$PJ2"
          start_vis() {
            local name="$1"; shift
            docker run --detach --name "${ro_prefix}-${name}" --network "$network_name" --network-alias "$name" \
              --tmpfs /tmp --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
              --env DB_HOST=db --env DB_NAME=fixture_prod --env DB_CHARSET=utf8mb4 --env DB_USER=cervesur_ro_visor --env DB_PASS="$RO_VISOR_PASS" \
              --env CERVESUR_REQUIRED_MODE=piloto_visual --env CERVESUR_PILOT_STATE_DIR=/tmp/estado --env PHP_CLI_SERVER_WORKERS=4 "$@" \
              cervesur-ci-php:local sh -c 'mkdir -p /tmp/estado && exec php -S 0.0.0.0:8080 tests/isolated/router.php' >/dev/null
          }
          start_vis appvis --env CERVESUR_MODE=piloto_visual --env JWT_SECRET="$PJ1" --env CERVESUR_PILOT_OPERATOR_HASH="$PILOT_HASH" --env CERVESUR_PILOT_VISOR_IDS="$PILOT_IDS"
          start_vis appvis0 --env CERVESUR_MODE=piloto_visual --env JWT_SECRET="$PJ2" --env CERVESUR_PILOT_OPERATOR_HASH="$PILOT_HASH" --env CERVESUR_PILOT_VISOR_IDS=
          start_vis appvisall --env CERVESUR_MODE=piloto_visual --env JWT_SECRET="$PJ2" --env CERVESUR_PILOT_OPERATOR_HASH="$PILOT_HASH" --env CERVESUR_PILOT_VISOR_IDS=TODOS
          start_vis appvthr --env CERVESUR_MODE=piloto_visual --env JWT_SECRET="$PJ1" --env CERVESUR_PILOT_OPERATOR_HASH="$PILOT_HASH" --env CERVESUR_PILOT_VISOR_IDS=
          start_vis appvbad1 --env CERVESUR_MODE=piloto_visual --env JWT_SECRET="$PJ1" --env CERVESUR_PILOT_VISOR_IDS=
          start_vis appvbad2 --env JWT_SECRET="$PJ1" --env CERVESUR_PILOT_OPERATOR_HASH="$PILOT_HASH" --env CERVESUR_PILOT_VISOR_IDS=
          sleep 3
          for suite in piloto_privilegios_test.php http_piloto_test.php; do
            docker run --rm --network "$network_name" \
              --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
              --env TEST_DB_PASS --env RO_VISOR_PASS --env PILOT_PASS --env PILOT_IDS \
              cervesur-ci-php:local php "tests/isolated/$suite"
          done

          # UX-07D.4B: piloto con usuarios reales (tres cuentas: catálogo de 21 columnas, autenticación de 9 y estado propio) sobre datos sintéticos.
          gen_pass() { echo "Aa1!$(openssl rand -hex 12)"; }
          U_AUTH_PASS="$(gen_pass)"; U_CAT_PASS="$(gen_pass)"; U_STATE_PASS="$(gen_pass)"; US1="$(openssl rand -hex 24)"; US2="$(openssl rand -hex 24)"
          export U_AUTH_PASS U_CAT_PASS U_STATE_PASS; U_SECRET="$US1"; export U_SECRET
          for v in "$U_AUTH_PASS" "$U_CAT_PASS" "$U_STATE_PASS" "$US1" "$US2"; do echo "::add-mask::$v"; done
          docker run --rm --network "$network_name" \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --env TEST_DB_PASS --env U_AUTH_PASS --env U_CAT_PASS --env U_STATE_PASS \
            cervesur-ci-php:local php tests/isolated/setup_usuarios_cuentas.php
          start_usr() {
            local name="$1"; shift
            docker run --detach --name "${ro_prefix}-${name}" --network "$network_name" --network-alias "$name" \
              --tmpfs /tmp --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
