name: Cervesur D3 Readonly Gate QA
on:
  pull_request:
    paths:
      - "ops/u-basic/d3_readonly_gate.py"
      - "ops/u-basic/d3_auth_synthetic.php"
      - "ops/u-basic/d3_auth_no_sqlite.php"
      - "ops/u-basic/d3_source_indicators.py"
      - "ops/u-basic/test_d3_source_indicators.py"
      - "ops/u-basic/d3_secret_read_triage.py"
      - "ops/u-basic/test_d3_secret_read_triage.py"
      - "ops/u-basic/d3_projection_origin.py"
      - "ops/u-basic/test_d3_projection_origin.py"
      - "ops/u-basic/d3_empresa_sandbox.py"
      - "ops/u-basic/d3_empresa_fixture.php"
      - "ops/u-basic/d3_k2_router_fixture.php"
      - "ops/u-basic/d3_k2_router_sandbox.py"
      - "ops/u-basic/test_d3_readonly_gate.py"
      - "ops/u-basic/D3-READONLY-GATE.md"
      - ".github/workflows/cervesur-d3-readonly.yml"
  push:
    branches:
      - "feat/cervesur-d3-qa-readonly-20261112"
    paths:
      - "ops/u-basic/d3_readonly_gate.py"
      - "ops/u-basic/d3_auth_synthetic.php"
      - "ops/u-basic/d3_auth_no_sqlite.php"
      - "ops/u-basic/d3_source_indicators.py"
      - "ops/u-basic/test_d3_source_indicators.py"
      - "ops/u-basic/d3_secret_read_triage.py"
      - "ops/u-basic/test_d3_secret_read_triage.py"
      - "ops/u-basic/d3_projection_origin.py"
      - "ops/u-basic/test_d3_projection_origin.py"
      - "ops/u-basic/d3_empresa_sandbox.py"
      - "ops/u-basic/d3_empresa_fixture.php"
      - "ops/u-basic/d3_k2_router_fixture.php"
      - "ops/u-basic/d3_k2_router_sandbox.py"
      - "ops/u-basic/test_d3_readonly_gate.py"
      - ".github/workflows/cervesur-d3-readonly.yml"
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax check
        run: python3 -m py_compile ops/u-basic/d3_readonly_gate.py ops/u-basic/test_d3_readonly_gate.py ops/u-basic/d3_source_indicators.py ops/u-basic/test_d3_source_indicators.py ops/u-basic/d3_secret_read_triage.py ops/u-basic/test_d3_secret_read_triage.py ops/u-basic/d3_projection_origin.py ops/u-basic/test_d3_projection_origin.py ops/u-basic/d3_empresa_sandbox.py ops/u-basic/d3_k2_router_sandbox.py
      - name: Security fixtures (offline only)
        run: cd ops/u-basic && python3 -m unittest -v test_d3_readonly_gate test_d3_source_indicators test_d3_secret_read_triage test_d3_projection_origin
      - name: D3 synthetic PHP syntax and read-only safeguards
        run: |
          php -l ops/u-basic/d3_auth_synthetic.php
          php -l ops/u-basic/d3_auth_no_sqlite.php
          php -l ops/u-basic/d3_empresa_fixture.php
          php -l ops/u-basic/d3_k2_router_fixture.php
          python3 ops/u-basic/d3_k2_router_sandbox.py --self-test
          python3 ops/u-basic/d3_empresa_sandbox.py --self-test
          php ops/u-basic/d3_auth_no_sqlite.php --fixture-test
          python3 - <<'PY'
          from pathlib import Path
          code = Path("ops/u-basic/d3_auth_synthetic.php").read_text()
          assert "sqlite::memory:" in code
          assert "'lib/auth_middleware.php'" in code
          assert "'lib/jwt.php'" in code
          assert "getallheaders" in code
          assert "D3_CIERRE_GLOBAL=PENDIENTE_OTROS_VECTORES_Y_FIRMAS" in code
          assert "require_once $realRoot . '/lib/db.php'" not in code
          assert "mysqli" not in code.lower()
          print("D3_PHP_PREFLIGHT_STATIC=PASS")
          PY
      - name: No production writes or access
        run: |
          echo "D3_QA_OFFLINE=PASS"
          echo "PRODUCCION_CONTACTADA=NO"
          echo "U_BASIC_ACTIVADO=NO"
