name: Cervesur P5-R Password Only QA
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/isolated/p5r_password_only_gate_test.php'
      - '.github/workflows/cervesur-p5r-password-only-qa.yml'
  push:
    branches:
      - 'feat/cervesur-p5r-password-only'
permissions:
  contents: read

jobs:
  php-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: PHP syntax
        run: |
          php -l backend/lib/admin_escritura.php
          php -l backend/router/AdminWriteRouter.php
          php -l backend/router/UserRouter.php
          php -l backend/models/UserModel.php
          php -l tests/isolated/p5r_password_only_gate_test.php
      - name: P5-R deny-role and password-only gates (no MySQL)
        run: php tests/isolated/p5r_password_only_gate_test.php
      - name: P5-R U-BASIC rollback shell and flags fail-closed
        run: |
          bash -n deploy/produccion-escritura/scripts/lib.sh
          bash -n deploy/produccion-escritura/scripts/interruptor-usuarios.sh
          python3 - <<'PY'
          from pathlib import Path
          a = Path('deploy/produccion-escritura/scripts/lib.sh').read_text()
          b = Path('deploy/produccion-escritura/scripts/interruptor-usuarios.sh').read_text()
          assert 'CAP_RESET=' in a and 'users_password_reset' in a
          assert '${CAP_RESET:-false}' in a and '${CAP_RESET:-false}' in b
          rollback = b.split('apagar() {', 1)[1].split('\n}', 1)[0]
          for key in (
            'ADMIN_WRITES_USUARIOS',
            'ADMIN_WRITES_USUARIOS_SENSIBLE',
            'ADMIN_WRITES_USUARIOS_PASSWORD_RESET',
            'ADMIN_P5R_FLUTTER_401_VERIFIED',
          ):
            assert key in rollback, key
          print('P5R_ROLLBACK_FLAGS=PASS')
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: React P5-R focused tests
        run: npx vitest run src/api/http/httpPasswordReset.test.ts src/api/http/httpAdminWrite.test.ts src/features/admin/ResetPasswordDialog.test.tsx src/app/adminUsers.test.tsx
      - run: npm run lint
