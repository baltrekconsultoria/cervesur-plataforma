name: Migracion diferencial CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/migracion/**'
      - 'tests/migracion/**'
      - 'docs/migracion-diferencial-v1.md'
      - '.github/workflows/migration-dryrun-ci.yml'

permissions:
  contents: read

jobs:
  migracion-solo-lectura:
    name: PHP lint y Python synthetic dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Sintaxis PHP
        run: php -l ops/migracion/export_snapshot.php
      - name: Compilacion Python
        run: python -m py_compile ops/migracion/compare_snapshots.py tests/migracion/test_dryrun.py
      - name: Pruebas sinteticas sin datos personales
        run: python -m unittest discover -s tests/migracion -v
