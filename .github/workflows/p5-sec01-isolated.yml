name: P5-SEC01 isolated PHP security QA

on:
  push:
    branches:
      - ci/cervesur-p5-sec01-qa

permissions:
  contents: read

jobs:
  strict-session:
    name: Strict JWT and session policy unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout code (never touches production)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare PHP SQLite isolated
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-cli php8.3-sqlite3
          php -v
          php -m | grep -i '^pdo_sqlite$'
      - name: Syntax PHP
        run: |
          php -l deploy/flutter-heredado/p5-sec01/candidato/p5_strict_auth.php
          php -l deploy/flutter-heredado/p5-sec01/tests/p5_strict_auth_test.php
      - name: Synthetic claims, role and session revocation matrix
        run: php deploy/flutter-heredado/p5-sec01/tests/p5_strict_auth_test.php
      - name: Verify all changed files are isolated
        run: |
          git fetch --no-tags --depth=1 origin feat/cervesur-ux-09a-cierre-usuarios
          changed="$(git diff --name-only FETCH_HEAD HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(backend/|frontend/|database/)' ; then
            echo "Unexpected live application changes"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Ev '^(deploy/flutter-heredado/p5-sec01/|\.github/workflows/p5-sec01-isolated.yml$)' ; then
            echo "Unexpected files outside P5-SEC01"
            exit 1
          fi
          echo 'P5_SEC01_ISOLATED=PASS'
