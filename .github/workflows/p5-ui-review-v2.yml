name: P5 UI technical review v2

on:
  push:
    branches:
      - ci/cervesur-p5-ui02-review-v2

permissions:
  contents: read

jobs:
  review:
    name: Validate PR14 frontend snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reproducible install
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Targeted P5 tests
        run: npx vitest run src/api/http/httpAdminWrite.test.ts src/api/http/httpPasswordReset.test.ts src/features/admin/ResetPasswordDialog.test.tsx
      - name: Full unit test suite
        run: npm test
      - name: Admin write build
        run: npm run build:admin-write
      - name: Validate admin write build
        run: npm run verify:admin-write
