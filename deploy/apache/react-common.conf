# Configuración COMÚN del sitio React de PRUEBA de Cervesur (UX-07D.0). Se incluye desde un VirtualHost (ver cervesur-react-prueba.vhost.conf.example).
# Requiere mod_rewrite, mod_headers, mod_alias y PHP (mod_php o php-fpm). No contiene contraseñas, IP privadas ni valores de .env.
#
# Antes de incluirla, el VirtualHost debe definir:
#   Define CERVESUR_REACT_FRONT   /var/www/cervesur-react-prueba/public      (contenido de dist-production/)
#   Define CERVESUR_REACT_BACKEND /opt/cervesur-react-prueba/backend         (copia del backend PHP FUERA del DocumentRoot, con su propio .env)

DocumentRoot "${CERVESUR_REACT_FRONT}"

<Directory "${CERVESUR_REACT_FRONT}">
    Options -Indexes
    # Permite que el .htaccess publicado con el frontend gestione la reescritura de React, la caché y las cabeceras.
    AllowOverride FileInfo AuthConfig Indexes Options=Indexes
    Require all granted
</Directory>

# --- API PHP -----------------------------------------------------------------------------------------------------------------
# /api/* se atiende con backend/api.php; REQUEST_URI conserva la ruta original, que es la que usa el router de PHP.
# El resto del backend (controllers, models, lib, .env) queda fuera del DocumentRoot y no es alcanzable por URL.
AliasMatch "^/api(/.*)?$" "${CERVESUR_REACT_BACKEND}/api.php"
<Directory "${CERVESUR_REACT_BACKEND}">
    Options -Indexes
    Require all granted
</Directory>

RewriteEngine On
# El endpoint heredado devuelve un token OAuth GENERAL de Power BI: el sitio de prueba React no lo necesita ni lo expone.
RewriteRule "^/api/powerbi(/|$)" - [F,L]

<IfModule mod_headers.c>
    # Las respuestas de la API (incluidos 401/403/404 en JSON) no se cachean y no se interpretan como otro tipo de contenido.
    <LocationMatch "^/api(/|$)">
        Header always set Cache-Control "no-store"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>
</IfModule>

# --- PHP -----------------------------------------------------------------------------------------------------------------------
# Con mod_php. Con php-fpm, fije lo mismo en el pool (php_admin_value[...]).
<IfModule mod_php.c>
    php_flag display_errors off
    php_flag log_errors on
    php_flag session.cookie_httponly on
    php_value session.cookie_samesite Strict
    # El PHP de este sitio solo puede leer su propio backend, /tmp y las sesiones: no ve /var/www/cervesur (Flutter).
    php_admin_value open_basedir "${CERVESUR_REACT_BACKEND}:/tmp:/var/lib/php/sessions"
    # Cookie de sesión propia: no se mezcla con PHPSESSID de otros sitios servidos desde el mismo host (p. ej. localhost con otro túnel).
    php_value session.name CERVESUR_REACT
</IfModule>
<IfModule php_module>
    php_flag display_errors off
    php_flag log_errors on
    php_flag session.cookie_httponly on
    php_value session.cookie_samesite Strict
    # El PHP de este sitio solo puede leer su propio backend, /tmp y las sesiones: no ve /var/www/cervesur (Flutter).
    php_admin_value open_basedir "${CERVESUR_REACT_BACKEND}:/tmp:/var/lib/php/sessions"
    # Cookie de sesión propia: no se mezcla con PHPSESSID de otros sitios servidos desde el mismo host (p. ej. localhost con otro túnel).
    php_value session.name CERVESUR_REACT
</IfModule>

# Los errores de Apache se registran en los logs del servidor; no se muestran detalles al navegador.
ServerSignature Off
