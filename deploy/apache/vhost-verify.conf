# SOLO para la verificación local en Docker (deploy/apache/verify-apache.mjs): mismo contenido común, sin TLS.
<VirtualHost *:80>
    ServerName localhost
    Define CERVESUR_REACT_FRONT   /var/www/cervesur-react-prueba/public
    Define CERVESUR_REACT_BACKEND /opt/cervesur-react-prueba/backend
    Include /etc/apache2/cervesur/react-common.conf
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
