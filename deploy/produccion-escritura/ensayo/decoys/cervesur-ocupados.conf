# SEÑUELO del ensayo: el servidor real tiene ocupados 8090 y 8091 (HTTP) y 8092 (piloto de usuarios, TLS). La huella de portales de la fase 1 consulta https://127.0.0.1:8092. No es parte del paquete.
Listen 127.0.0.1:8090
Listen 127.0.0.1:8091
Listen 127.0.0.1:8092
<VirtualHost 127.0.0.1:8090 127.0.0.1:8091>
    ServerName localhost
    DocumentRoot /var/www/cervesur-qa-8094/public
    Header always set X-Senuelo "ocupado"
</VirtualHost>
<VirtualHost 127.0.0.1:8092>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/senuelo.crt
    SSLCertificateKeyFile /etc/ssl/private/senuelo.key
    DocumentRoot /var/www/cervesur-qa-8094/public
    Header always set X-Senuelo "usuarios-8092"
</VirtualHost>
