# SEÑUELO del ensayo: emula la QA administrativa aislada del servidor real (127.0.0.1:8094, HTTP). No es parte del paquete.
Listen 127.0.0.1:8094
<VirtualHost 127.0.0.1:8094>
    ServerName localhost
    DocumentRoot /var/www/cervesur-qa-8094/public
    <Directory /var/www/cervesur-qa-8094/public>
        Require all granted
    </Directory>
    Header always set X-Senuelo "qa-8094"
</VirtualHost>
