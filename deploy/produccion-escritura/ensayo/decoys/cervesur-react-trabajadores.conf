# SEÑUELO del ensayo: emula el React de trabajadores del servidor real (TLS autofirmado, 443). No es parte del paquete.
# Igual que el servidor real: el React de trabajadores escucha SOLO en la IP corporativa (192.168.200.12:443), no en loopback.
Listen 192.168.200.12:443
<VirtualHost 192.168.200.12:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/senuelo.crt
    SSLCertificateKeyFile /etc/ssl/private/senuelo.key
    DocumentRoot /var/www/cervesur-react-trabajadores/public
    <Directory /var/www/cervesur-react-trabajadores/public>
        Require all granted
    </Directory>
    Header always set X-Senuelo "trabajadores"
</VirtualHost>
