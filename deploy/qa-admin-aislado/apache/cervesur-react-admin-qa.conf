# Sitio React ADMINISTRATIVO DE QA (UX-08F) · accesible SOLO por túnel SSH. Se instala como
# /etc/apache2/sites-available/cervesur-react-admin-qa.conf (lo hace scripts/instalar.sh).
# MARCA-INSTALACION: cervesur-react-admin-qa
#
# - PLANTILLA: instalar.sh sustituye @PUERTO@ por el puerto validado que eligió el operador (--puerto).
# - Escucha únicamente en loopback (127.0.0.1:@PUERTO@): no hay socket en la red corporativa.
# - VirtualHost independiente de Flutter (80), React de trabajadores (443), React admin (8443), 8088 y 8089: no modifica ninguno.
# - Desde Windows:  ssh -N -L 18091:127.0.0.1:@PUERTO@ <usuario>@<servidor>   y se abre  http://localhost:18091
# - No contiene contraseñas ni valores de .env (el backend lee su propio .env, fuera del DocumentRoot).
Listen 127.0.0.1:@PUERTO@

<VirtualHost 127.0.0.1:@PUERTO@>
    ServerName localhost
    Define CERVESUR_QAADMIN_FRONT    /var/www/cervesur-react-admin-qa/public
    Define CERVESUR_QAADMIN_BACKEND  /opt/cervesur-react-admin-qa/backend
    Define CERVESUR_QAADMIN_SESSIONS /var/lib/cervesur-react-admin-qa/sessions
    Include /etc/apache2/cervesur-react-admin-qa/react-admin-qa-common.conf
    ErrorLog  ${APACHE_LOG_DIR}/cervesur-react-admin-qa-error.log
    CustomLog ${APACHE_LOG_DIR}/cervesur-react-admin-qa-access.log combined
</VirtualHost>
