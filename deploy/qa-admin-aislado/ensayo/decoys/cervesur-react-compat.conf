# SEÑUELO del ensayo: emula el React compat del servidor real. No es parte del paquete.
Listen 127.0.0.1:8089
<VirtualHost 127.0.0.1:8089>
    ServerName localhost
    DocumentRoot /var/www/cervesur-react-compat/public
    <Directory /var/www/cervesur-react-compat/public>
        Require all granted
    </Directory>
    Header always set X-Senuelo "compat"
</VirtualHost>
