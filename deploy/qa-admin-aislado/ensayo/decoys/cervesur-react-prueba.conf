# SEÑUELO del ensayo: emula el React prueba del servidor real. No es parte del paquete.
Listen 127.0.0.1:8088
<VirtualHost 127.0.0.1:8088>
    ServerName localhost
    DocumentRoot /var/www/cervesur-react-prueba/public
    <Directory /var/www/cervesur-react-prueba/public>
        Require all granted
    </Directory>
    Header always set X-Senuelo "prueba"
</VirtualHost>
