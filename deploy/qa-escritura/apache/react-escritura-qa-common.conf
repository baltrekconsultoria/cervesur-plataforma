# Configuración COMÚN del sitio React de ESCRITURA ADMINISTRATIVA de QA (UX-08H), accesible solo por túnel SSH en 127.0.0.1:<puerto elegido>.
# Es INDEPENDIENTE de los demás portales (Flutter 80, React 443/8443, 8088 y 8089): nombres de Define, cookie y almacenamiento de sesiones propios.
# Requiere mod_rewrite, mod_alias, mod_php y mod_headers (ya cargados en el servidor; este instalador NO habilita ni deshabilita módulos).
# No contiene contraseñas, IP privadas ni valores de .env.
#
# El VirtualHost debe definir antes de incluirla:
#   Define CERVESUR_QAESC_FRONT    /var/www/cervesur-react-escritura-qa/public      (contenido de dist-admin-write/)
#   Define CERVESUR_QAESC_BACKEND  /opt/cervesur-react-escritura-qa/backend         (backend PHP FUERA del DocumentRoot, con su propio .env)
#   Define CERVESUR_QAESC_SESSIONS /var/lib/cervesur-react-escritura-qa/sessions    (sesiones PHP exclusivas de este sitio, 0700 www-data)

DocumentRoot "${CERVESUR_QAESC_FRONT}"

<Directory "${CERVESUR_QAESC_FRONT}">
    Options -Indexes
    # Permite que el .htaccess publicado con el frontend gestione la reescritura de React, la caché y las cabeceras.
    AllowOverride FileInfo AuthConfig Indexes Options=Indexes
    Require all granted
</Directory>

# --- API PHP -----------------------------------------------------------------------------------------------------------------
# /api/* se atiende con backend/api.php; REQUEST_URI conserva la ruta original, que es la que usa el router de PHP.
AliasMatch "^/api(/.*)?$" "${CERVESUR_QAESC_BACKEND}/api.php"
<Directory "${CERVESUR_QAESC_BACKEND}">
    Options -Indexes
    Require all granted
</Directory>

RewriteEngine On
# El endpoint heredado devuelve un token OAuth GENERAL de Power BI: este sitio no lo necesita ni lo expone.
RewriteRule "^/api/powerbi(/|$)" - [F,L]

<IfModule mod_headers.c>
    <LocationMatch "^/api(/|$)">
        Header always set Cache-Control "no-store"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>
</IfModule>

# --- PHP: sesiones AISLADAS de los demás portales ------------------------------------------------------------------------------
# Las cookies del navegador no se separan por puerto (localhost:18095 y localhost:18095 comparten el mismo "sitio de cookies"), así que
# este sitio usa un NOMBRE de cookie propio y un almacenamiento de sesiones propio. `php_admin_*` impide que el código lo cambie en ejecución.
#  - HttpOnly y SameSite=Strict siempre.
#  - Secure DESACTIVADO de forma explícita: el túnel es HTTP en loopback (localhost); un php.ini global con session.cookie_secure=1 no debe romperlo.
#  - open_basedir: el PHP de este sitio solo ve su backend, /tmp y su directorio de sesiones (no ve Flutter ni ningún otro portal).
<IfModule mod_php.c>
    php_flag display_errors off
    php_flag log_errors on
    php_admin_flag session.cookie_httponly on
    php_admin_value session.cookie_samesite Strict
    php_admin_flag session.cookie_secure off
    php_admin_value session.name CERVESUR_REACT_ESCRITURA_QA
    php_admin_value session.save_path "${CERVESUR_QAESC_SESSIONS}"
    php_admin_value session.gc_probability 1
    php_admin_value session.gc_divisor 100
    php_admin_value session.gc_maxlifetime 3600
    php_admin_value open_basedir "${CERVESUR_QAESC_BACKEND}:/tmp:${CERVESUR_QAESC_SESSIONS}"
</IfModule>
<IfModule php_module>
    php_flag display_errors off
    php_flag log_errors on
    php_admin_flag session.cookie_httponly on
    php_admin_value session.cookie_samesite Strict
    php_admin_flag session.cookie_secure off
    php_admin_value session.name CERVESUR_REACT_ESCRITURA_QA
    php_admin_value session.save_path "${CERVESUR_QAESC_SESSIONS}"
    php_admin_value session.gc_probability 1
    php_admin_value session.gc_divisor 100
    php_admin_value session.gc_maxlifetime 3600
    php_admin_value open_basedir "${CERVESUR_QAESC_BACKEND}:/tmp:${CERVESUR_QAESC_SESSIONS}"
</IfModule>

ServerSignature Off
