# SEÑUELO del ensayo: emula el React admin del servidor real (TLS autofirmado). No es parte del paquete.
Listen 127.0.0.1:8443
<VirtualHost 127.0.0.1:8443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/senuelo.crt
    SSLCertificateKeyFile /etc/ssl/private/senuelo.key
    DocumentRoot /var/www/cervesur-react-admin/public
    <Directory /var/www/cervesur-react-admin/public>
        Require all granted
    </Directory>
    Header always set X-Senuelo "admin"
</VirtualHost>
