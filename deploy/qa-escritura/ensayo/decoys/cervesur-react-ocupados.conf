# SEÑUELO del ensayo: el servidor real tiene Apache escuchando también en 127.0.0.1:8090-8094 (8094 = QA administrativo aislado; 8090-8093 evidencia del operador, 2026-11-03). No es parte del paquete.
Listen 127.0.0.1:8090
Listen 127.0.0.1:8091
Listen 127.0.0.1:8092
Listen 127.0.0.1:8093
Listen 127.0.0.1:8094
<VirtualHost 127.0.0.1:8090 127.0.0.1:8091 127.0.0.1:8092 127.0.0.1:8093 127.0.0.1:8094>
    ServerName localhost
    DocumentRoot /var/www/cervesur-react-prueba/public
    <Directory /var/www/cervesur-react-prueba/public>
        Require all granted
    </Directory>
    Header always set X-Senuelo "ocupado"
</VirtualHost>
