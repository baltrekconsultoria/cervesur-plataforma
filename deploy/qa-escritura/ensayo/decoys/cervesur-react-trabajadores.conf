# SEÑUELO del ensayo: emula el React trabajadores del servidor real (TLS autofirmado). No es parte del paquete.
# 443 lo abre ports.conf (ssl_module)
<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/senuelo.crt
    SSLCertificateKeyFile /etc/ssl/private/senuelo.key
    DocumentRoot /var/www/cervesur-react-trabajadores/public
    <Directory /var/www/cervesur-react-trabajadores/public>
        Require all granted
    </Directory>
    Header always set X-Senuelo "trabajadores"
</VirtualHost>
