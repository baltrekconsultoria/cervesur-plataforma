# Sitio React de COMPATIBILIDAD PRODUCTIVA (UX-07D.2C) · accesible SOLO por túnel SSH. Se instala como
# /etc/apache2/sites-available/cervesur-react-compat.conf (lo hace scripts/instalar.sh).
#
# - Escucha únicamente en loopback (127.0.0.1:8089): no hay socket en la red corporativa.
# - VirtualHost independiente del portal Flutter (puerto 80) y del React de prueba (127.0.0.1:8088): no modifica ninguno de los dos.
# - Desde Windows:  ssh -N -L 18090:127.0.0.1:8089 usr_cervesur@<servidor>   y se abre  http://localhost:18090
# - No contiene contraseñas ni valores de .env (el backend lee su propio .env, fuera del DocumentRoot).
Listen 127.0.0.1:8089

<VirtualHost 127.0.0.1:8089>
    ServerName localhost
    Define CERVESUR_COMPAT_FRONT    /var/www/cervesur-react-compat/public
    Define CERVESUR_COMPAT_BACKEND  /opt/cervesur-react-compat/backend
    Define CERVESUR_COMPAT_SESSIONS /var/lib/cervesur-react-compat/sessions
    Include /etc/apache2/cervesur-react-compat/react-compat-common.conf
    ErrorLog  ${APACHE_LOG_DIR}/cervesur-react-compat-error.log
    CustomLog ${APACHE_LOG_DIR}/cervesur-react-compat-access.log combined
</VirtualHost>
