# Sitio del PILOTO CON USUARIOS REALES (UX-07D.4B.1) · accesible SOLO por túnel SSH y SOLO por HTTPS. Se instala como
# /etc/apache2/sites-available/cervesur-react-usuarios.conf (lo hace scripts/instalar.sh).
#
# - Escucha únicamente en loopback (127.0.0.1:8092): no hay socket en la red corporativa.
# - TLS REAL en el propio socket (mod_ssl): una petición HTTP sin cifrar a este puerto recibe «400 Bad Request» de Apache y NUNCA llega a PHP.
#   No existe ningún VirtualHost HTTP para este piloto ni ninguna excepción que permita iniciar sesión por HTTP.
# - VirtualHost independiente de Flutter (80), 8088, 8089, 8090 y 8091. No contiene contraseñas ni valores de .env.
# - Desde Windows:  ssh -N -L 18093:127.0.0.1:8092 usr_cervesur@<servidor>   y se abre  https://localhost:18093
#   (el navegador debe confiar en el certificado del piloto: ver docs/INSTALACION-PILOTO-USUARIOS-8092.md)
Listen 127.0.0.1:8092

<VirtualHost 127.0.0.1:8092>
    ServerName localhost
    Define CERVESUR_USUARIOS_FRONT    /var/www/cervesur-react-usuarios/public
    Define CERVESUR_USUARIOS_BACKEND  /opt/cervesur-react-usuarios/backend
    Define CERVESUR_USUARIOS_SESSIONS /var/lib/cervesur-react-usuarios/sessions

    SSLEngine on
    SSLCertificateFile    /etc/apache2/cervesur-react-usuarios/tls/servidor.crt
    SSLCertificateKeyFile /etc/apache2/cervesur-react-usuarios/tls/servidor.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCompression off

    Include /etc/apache2/cervesur-react-usuarios/react-usuarios-common.conf
    ErrorLog  ${APACHE_LOG_DIR}/cervesur-react-usuarios-error.log
    CustomLog ${APACHE_LOG_DIR}/cervesur-react-usuarios-access.log combined
</VirtualHost>
