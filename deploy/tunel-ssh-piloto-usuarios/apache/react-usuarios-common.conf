# Configuración COMÚN del sitio del PILOTO CON USUARIOS REALES (UX-07D.4B.1), accesible solo por túnel SSH en https://127.0.0.1:8092.
# Es INDEPENDIENTE de las de 8088, 8089, 8090 y 8091: nombres de Define, cookie y almacenamiento propios.
# Requiere mod_ssl, mod_rewrite, mod_alias, mod_php y mod_headers (ya habilitados por los instaladores anteriores; este instalador NO habilita ni deshabilita módulos).
# No contiene contraseñas, IP privadas ni valores de .env.
#
# El VirtualHost debe definir antes de incluirla:
#   Define CERVESUR_USUARIOS_FRONT    /var/www/cervesur-react-usuarios/public   (contenido de frontend/dist-pilot-usuarios/: la aplicación SIN pantallas de administración)
#   Define CERVESUR_USUARIOS_BACKEND  /opt/cervesur-react-usuarios/backend      (backend PHP FUERA del DocumentRoot, con su propio .env)
#   Define CERVESUR_USUARIOS_SESSIONS /var/lib/cervesur-react-usuarios/sessions (aislamiento de sesiones PHP; el modo no abre ninguna)

DocumentRoot "${CERVESUR_USUARIOS_FRONT}"
TraceEnable Off

<Directory "${CERVESUR_USUARIOS_FRONT}">
    Options -Indexes
    # Permite que el .htaccess publicado con el frontend gestione la reescritura de React, la caché y las cabeceras (CSP con frame-src de Power BI).
    AllowOverride FileInfo AuthConfig Indexes Options=Indexes
    Require all granted
</Directory>

# --- API PHP -----------------------------------------------------------------------------------------------------------------
AliasMatch "^/api(/.*)?$" "${CERVESUR_USUARIOS_BACKEND}/api.php"
<Directory "${CERVESUR_USUARIOS_BACKEND}">
    Options None
    AllowOverride None
    Require all granted
</Directory>

RewriteEngine On
# El endpoint heredado devuelve un token OAuth GENERAL de Power BI: este sitio no lo necesita ni lo expone.
RewriteRule "^/api/powerbi(/|$)" - [F,L]

# Solo GET y POST (consulta e inicio de sesión): PUT, DELETE, PATCH, OPTIONS y demás reciben 403 antes de llegar a PHP.
<Location "/">
    <LimitExcept GET POST>
        Require all denied
    </LimitExcept>
</Location>

<IfModule mod_headers.c>
    # El cliente NUNCA decide si la conexión es segura: cualquier cabecera de protocolo/origen que traiga la petición se ELIMINA antes de llegar a PHP.
    # (La seguridad de la conexión la fija mod_ssl con la variable HTTPS, que un cliente no puede forjar.)
    RequestHeader unset X-Forwarded-Proto
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Port
    RequestHeader unset Forwarded
    RequestHeader unset X-Real-IP
    RequestHeader unset Front-End-Https
    RequestHeader unset X-Url-Scheme

    <LocationMatch "^/api(/|$)">
        Header always set Cache-Control "no-store"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>

    # Red de seguridad: si algún código llegara a emitir una cookie, sale con Secure y HttpOnly (hoy la API no emite ninguna: el token viaja en Authorization).
    # («Header edit» actúa sobre las respuestas correctas, donde PHP deja su Set-Cookie; «always» sobre las de error.)
    Header edit Set-Cookie "^((?!.*;\s*Secure).*)$" "$1; Secure"
    Header edit Set-Cookie "^((?!.*;\s*HttpOnly).*)$" "$1; HttpOnly"
    Header always edit Set-Cookie "^((?!.*;\s*Secure).*)$" "$1; Secure"
    Header always edit Set-Cookie "^((?!.*;\s*HttpOnly).*)$" "$1; HttpOnly"
    # HSTS NO se emite en el acceso por túnel: el nombre es «localhost» y HSTS afectaría a TODOS los puertos de localhost (los túneles de los otros portales).
    # En un acceso corporativo con nombre propio se activa con CERVESUR_PILOT_HSTS=SI en el .env (ver docs/HTTPS-PILOTO-USUARIOS.md).
</IfModule>

# --- PHP: aislamiento de los demás portales --------------------------------------------------------------------------------------
# Cookie y almacenamiento de sesiones propios (el modo no inicia sesiones PHP: el token es opaco, de 256 bits, y vive hasheado en la base de estado).
# `php_admin_*` impide que el código lo cambie. open_basedir: el PHP de este sitio solo ve su backend, /tmp y sus sesiones.
<IfModule mod_php.c>
    php_flag display_errors off
    php_flag log_errors on
    php_admin_flag session.cookie_httponly on
    php_admin_flag session.cookie_secure on
    php_admin_value session.cookie_samesite Strict
    php_admin_value session.name CERVESUR_REACT_USUARIOS
    php_admin_value session.save_path "${CERVESUR_USUARIOS_SESSIONS}"
    php_admin_value open_basedir "${CERVESUR_USUARIOS_BACKEND}:/tmp:${CERVESUR_USUARIOS_SESSIONS}"
</IfModule>
<IfModule php_module>
    php_flag display_errors off
    php_flag log_errors on
    php_admin_flag session.cookie_httponly on
    php_admin_flag session.cookie_secure on
    php_admin_value session.cookie_samesite Strict
    php_admin_value session.name CERVESUR_REACT_USUARIOS
    php_admin_value session.save_path "${CERVESUR_USUARIOS_SESSIONS}"
    php_admin_value open_basedir "${CERVESUR_USUARIOS_BACKEND}:/tmp:${CERVESUR_USUARIOS_SESSIONS}"
</IfModule>

ServerSignature Off
