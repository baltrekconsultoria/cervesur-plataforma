# Sitio del PILOTO VISUAL con informes reales (UX-07D.4) · accesible SOLO por túnel SSH. Se instala como
# /etc/apache2/sites-available/cervesur-react-piloto.conf (lo hace scripts/instalar.sh).
#
# - Escucha únicamente en loopback (127.0.0.1:8091): no hay socket en la red corporativa.
# - VirtualHost independiente de Flutter (80), del React de prueba (127.0.0.1:8088), del de compatibilidad (127.0.0.1:8089) y del diagnóstico (127.0.0.1:8090).
# - Desde Windows:  ssh -N -L 18092:127.0.0.1:8091 usr_cervesur@<servidor>   y se abre  http://localhost:18092
# - No contiene contraseñas ni valores de .env (el backend lee su propio .env, fuera del DocumentRoot).
Listen 127.0.0.1:8091

<VirtualHost 127.0.0.1:8091>
    ServerName localhost
    Define CERVESUR_PILOTO_FRONT    /var/www/cervesur-react-piloto/public
    Define CERVESUR_PILOTO_BACKEND  /opt/cervesur-react-piloto/backend
    Define CERVESUR_PILOTO_SESSIONS /var/lib/cervesur-react-piloto/sessions
    Define CERVESUR_PILOTO_ESTADO   /var/lib/cervesur-react-piloto/estado
    Include /etc/apache2/cervesur-react-piloto/react-piloto-common.conf
    ErrorLog  ${APACHE_LOG_DIR}/cervesur-react-piloto-error.log
    CustomLog ${APACHE_LOG_DIR}/cervesur-react-piloto-access.log combined
</VirtualHost>
