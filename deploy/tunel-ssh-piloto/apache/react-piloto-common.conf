# Configuración COMÚN del sitio del PILOTO VISUAL (UX-07D.4), accesible solo por túnel SSH en 127.0.0.1:8091.
# Es INDEPENDIENTE de las de 8088, 8089 y 8090: nombres de Define, cookie y almacenamiento propios.
# Requiere mod_rewrite, mod_alias, mod_php y mod_headers (ya habilitado por el instalador de 8088; este instalador NO lo modifica).
# No contiene contraseñas, IP privadas ni valores de .env.
#
# El VirtualHost debe definir antes de incluirla:
#   Define CERVESUR_PILOTO_FRONT    /var/www/cervesur-react-piloto/public   (contenido de frontend/dist-pilot/: la aplicación SIN pantallas de administración)
#   Define CERVESUR_PILOTO_BACKEND  /opt/cervesur-react-piloto/backend      (backend PHP FUERA del DocumentRoot, con su propio .env)
#   Define CERVESUR_PILOTO_SESSIONS /var/lib/cervesur-react-piloto/sessions (aislamiento de sesiones PHP; el modo piloto no abre ninguna)
#   Define CERVESUR_PILOTO_ESTADO   /var/lib/cervesur-react-piloto/estado   (contador de intentos de inicio de sesión del operador; nunca MySQL)

DocumentRoot "${CERVESUR_PILOTO_FRONT}"
TraceEnable Off

<Directory "${CERVESUR_PILOTO_FRONT}">
    Options -Indexes
    # Permite que el .htaccess publicado con el frontend gestione la reescritura de React, la caché y las cabeceras (CSP con frame-src de Power BI).
    AllowOverride FileInfo AuthConfig Indexes Options=Indexes
    Require all granted
</Directory>

# --- API PHP -----------------------------------------------------------------------------------------------------------------
# /api/* se atiende con backend/api.php; REQUEST_URI conserva la ruta original, que es la que evalúa la puerta de rutas de PHP.
AliasMatch "^/api(/.*)?$" "${CERVESUR_PILOTO_BACKEND}/api.php"
<Directory "${CERVESUR_PILOTO_BACKEND}">
    Options None
    AllowOverride None
    Require all granted
</Directory>

RewriteEngine On
# El endpoint heredado devuelve un token OAuth GENERAL de Power BI: este sitio no lo necesita ni lo expone.
RewriteRule "^/api/powerbi(/|$)" - [F,L]

# Solo GET y POST (consulta e inicio de sesión): PUT, DELETE, PATCH, OPTIONS y demás reciben 403 antes de llegar a PHP.
<Location "/">
    <LimitExcept GET POST>
        Require all denied
    </LimitExcept>
</Location>

<IfModule mod_headers.c>
    <LocationMatch "^/api(/|$)">
        Header always set Cache-Control "no-store"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>
</IfModule>

# --- PHP: aislamiento de los demás portales --------------------------------------------------------------------------------------
# Cookie y almacenamiento de sesiones propios (el modo piloto no inicia sesiones PHP: el token viaja en la cabecera Authorization y se guarda en la memoria
# del navegador). `php_admin_*` impide que el código lo cambie. open_basedir: el PHP de este sitio solo ve su backend, /tmp, sus sesiones y su carpeta de estado.
<IfModule mod_php.c>
    php_flag display_errors off
    php_flag log_errors on
    php_admin_flag session.cookie_httponly on
    php_admin_value session.cookie_samesite Strict
    php_admin_flag session.cookie_secure off
    php_admin_value session.name CERVESUR_REACT_PILOTO
    php_admin_value session.save_path "${CERVESUR_PILOTO_SESSIONS}"
    php_admin_value open_basedir "${CERVESUR_PILOTO_BACKEND}:/tmp:${CERVESUR_PILOTO_SESSIONS}:${CERVESUR_PILOTO_ESTADO}"
</IfModule>
<IfModule php_module>
    php_flag display_errors off
    php_flag log_errors on
    php_admin_flag session.cookie_httponly on
    php_admin_value session.cookie_samesite Strict
    php_admin_flag session.cookie_secure off
    php_admin_value session.name CERVESUR_REACT_PILOTO
    php_admin_value session.save_path "${CERVESUR_PILOTO_SESSIONS}"
    php_admin_value open_basedir "${CERVESUR_PILOTO_BACKEND}:/tmp:${CERVESUR_PILOTO_SESSIONS}:${CERVESUR_PILOTO_ESTADO}"
</IfModule>

ServerSignature Off
