# Sitio de DIAGNÓSTICO AGREGADO DE SOLO LECTURA (UX-07D.3B) · accesible SOLO por túnel SSH. Se instala como
# /etc/apache2/sites-available/cervesur-react-ro.conf (lo hace scripts/instalar.sh).
#
# - Escucha únicamente en loopback (127.0.0.1:8090): no hay socket en la red corporativa.
# - VirtualHost independiente de Flutter (puerto 80), del React de prueba (127.0.0.1:8088) y del de compatibilidad (127.0.0.1:8089): no modifica ninguno.
# - Desde Windows:  ssh -N -L 18091:127.0.0.1:8090 usr_cervesur@<servidor>   y se consulta  http://localhost:18091/api/diagnostico/resumen
# - No contiene contraseñas ni valores de .env (el backend lee su propio .env, fuera de cualquier DocumentRoot).
Listen 127.0.0.1:8090

<VirtualHost 127.0.0.1:8090>
    ServerName localhost
    Define CERVESUR_RO_DOCROOT  /var/lib/cervesur-react-ro/docroot
    Define CERVESUR_RO_BACKEND  /opt/cervesur-react-ro/backend
    Define CERVESUR_RO_SESSIONS /var/lib/cervesur-react-ro/sessions
    Include /etc/apache2/cervesur-react-ro/react-ro-common.conf
    ErrorLog  ${APACHE_LOG_DIR}/cervesur-react-ro-error.log
    CustomLog ${APACHE_LOG_DIR}/cervesur-react-ro-access.log combined
</VirtualHost>
