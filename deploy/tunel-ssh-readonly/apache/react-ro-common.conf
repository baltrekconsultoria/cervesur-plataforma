# Configuración COMÚN del sitio de DIAGNÓSTICO AGREGADO DE SOLO LECTURA (UX-07D.3B), accesible solo por túnel SSH en 127.0.0.1:8090.
# Es INDEPENDIENTE de las de 8088 y 8089. Requiere mod_alias, mod_php y mod_headers (ya habilitado por el instalador de 8088; este instalador NO lo modifica).
# No contiene contraseñas, IP privadas ni valores de .env.
#
# Este sitio NO publica ninguna aplicación: el DocumentRoot es un directorio VACÍO y TODA petición se entrega al router PHP de diagnóstico, que solo
# atiende GET /api/ping y los dos GET /api/diagnostico/* (con X-Diagnostic-Token). Lo demás recibe 403, sin acceso a archivos internos.
#
# El VirtualHost debe definir antes de incluirla:
#   Define CERVESUR_RO_DOCROOT  /var/lib/cervesur-react-ro/docroot   (vacío, root:root)
#   Define CERVESUR_RO_BACKEND  /opt/cervesur-react-ro/backend        (backend PHP con su propio .env)
#   Define CERVESUR_RO_SESSIONS /var/lib/cervesur-react-ro/sessions   (aislamiento de sesiones PHP; el modo diagnóstico no abre ninguna)

DocumentRoot "${CERVESUR_RO_DOCROOT}"
TraceEnable Off

<Directory "${CERVESUR_RO_DOCROOT}">
    Options None
    AllowOverride None
    Require all granted
</Directory>

# TODA la ruta se atiende con backend/api.php (REQUEST_URI conserva la ruta original, que es la que evalúa la puerta de rutas de PHP).
AliasMatch "^/(.*)$" "${CERVESUR_RO_BACKEND}/api.php"
<Directory "${CERVESUR_RO_BACKEND}">
    Options None
    AllowOverride None
    Require all granted
</Directory>

# Solo GET (y HEAD, que la puerta de PHP rechaza): cualquier otro método recibe 403 antes de llegar a PHP.
<Location "/">
    <LimitExcept GET>
        Require all denied
    </LimitExcept>
</Location>

<IfModule mod_headers.c>
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
</IfModule>

# --- PHP: aislamiento de los demás portales --------------------------------------------------------------------------------------
# Cookie y almacenamiento de sesiones propios (el modo diagnóstico no inicia sesiones; esto evita que una futura sesión se mezcle con otro portal).
# `php_admin_*` impide que el código lo cambie. open_basedir: el PHP de este sitio solo ve su backend, /tmp y su directorio de sesiones.
<IfModule mod_php.c>
    php_flag display_errors off
    php_flag log_errors on
    php_admin_flag session.cookie_httponly on
    php_admin_value session.cookie_samesite Strict
    php_admin_flag session.cookie_secure off
    php_admin_value session.name CERVESUR_REACT_RO
    php_admin_value session.save_path "${CERVESUR_RO_SESSIONS}"
    php_admin_value open_basedir "${CERVESUR_RO_BACKEND}:/tmp:${CERVESUR_RO_SESSIONS}"
</IfModule>
<IfModule php_module>
    php_flag display_errors off
    php_flag log_errors on
    php_admin_flag session.cookie_httponly on
    php_admin_value session.cookie_samesite Strict
    php_admin_flag session.cookie_secure off
    php_admin_value session.name CERVESUR_REACT_RO
    php_admin_value session.save_path "${CERVESUR_RO_SESSIONS}"
    php_admin_value open_basedir "${CERVESUR_RO_BACKEND}:/tmp:${CERVESUR_RO_SESSIONS}"
</IfModule>

ServerSignature Off
