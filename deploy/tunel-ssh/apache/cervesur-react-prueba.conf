# Sitio React de PRUEBA de Cervesur · accesible SOLO por túnel SSH (UX-07D.1B).
# Se instala como /etc/apache2/sites-available/cervesur-react-prueba.conf (lo hace scripts/instalar.sh).
#
# - Escucha únicamente en la interfaz de loopback (127.0.0.1:8088): no hay socket en la red corporativa.
# - Es un VirtualHost independiente: NO modifica cervesur.conf ni /var/www/cervesur (Flutter, puerto 80).
# - Desde Windows:  ssh -N -L 18089:127.0.0.1:8088 usr_cervesur@<servidor>   y se abre  http://localhost:18089
# - No contiene contraseñas ni valores de .env (el backend lee su propio .env, fuera del DocumentRoot).
Listen 127.0.0.1:8088

<VirtualHost 127.0.0.1:8088>
    ServerName localhost
    Define CERVESUR_REACT_FRONT   /var/www/cervesur-react-prueba/public
    Define CERVESUR_REACT_BACKEND /opt/cervesur-react-prueba/backend
    Include /etc/apache2/cervesur-react-prueba/react-common.conf
    ErrorLog  ${APACHE_LOG_DIR}/cervesur-react-prueba-error.log
    CustomLog ${APACHE_LOG_DIR}/cervesur-react-prueba-access.log combined
</VirtualHost>
